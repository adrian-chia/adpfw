<!doctype html><meta charset=utf-8><title>Day-of checklist</title><style>
body{font:15px/1.5 -apple-system,Segoe UI,Calibri,sans-serif;max-width:820px;margin:20px auto;color:#222}h1,h2{color:#8B1A4A}h2{font-size:18px;margin:18px 0 6px}
label{display:block;padding:5px 8px;border-bottom:1px solid #eee;cursor:pointer}label:hover{background:#F6ECF0}input{margin-right:8px;transform:scale(1.2)}
#bar{height:12px;background:#eee;border-radius:6px;overflow:hidden;margin:8px 0}#fill{height:100%;background:#8B1A4A;width:0}button{font-size:14px;padding:6px 12px;border:1px solid #8B1A4A;background:#fff;color:#8B1A4A;border-radius:6px}</style>
<h1>Day-of checklist</h1><div id=bar><div id=fill></div></div><span id=pct></span> <button onclick="localStorage.removeItem('ck');location.reload()">Clear all</button><h2>The day before</h2><label><input type=checkbox data-k='The day before0'> Rehearse the full talk at least twice with the timing sheet; note slides that run long</label><label><input type=checkbox data-k='The day before1'> Save the deck as PDF from PowerPoint (File → Save As → PDF) as a fallback</label><label><input type=checkbox data-k='The day before2'> Copy the .pptx and the PDF to a USB stick and to cloud storage</label><label><input type=checkbox data-k='The day before3'> Print the cheat sheet; optionally print 20 copies of the audience handout</label><label><input type=checkbox data-k='The day before4'> Read the Q&amp;A file once; practise the five hardest answers aloud (circularity, recall 1.0, simulated data, scope narrowing, evasion)</label><label><input type=checkbox data-k='The day before5'> Check that every number you will say matches the number source map</label><h2>One hour before</h2><label><input type=checkbox data-k='One hour before0'> Laptop charged; charger packed</label><label><input type=checkbox data-k='One hour before1'> Video adapter for the room (HDMI / USB-C) packed</label><label><input type=checkbox data-k='One hour before2'> Clicker or presenter remote tested</label><label><input type=checkbox data-k='One hour before3'> Open the deck; check fonts and that all images display</label><label><input type=checkbox data-k='One hour before4'> Turn on Do Not Disturb; close chat and email apps</label><label><input type=checkbox data-k='One hour before5'> Water bottle</label><h2>In the room</h2><label><input type=checkbox data-k='In the room0'> Connect to the projector; use Presenter View (notes on your screen, slides on the projector)</label><label><input type=checkbox data-k='In the room1'> Check the slide-1 title and the colours on the projector</label><label><input type=checkbox data-k='In the room2'> Test the clicker from where you will stand</label><label><input type=checkbox data-k='In the room3'> Note the time limit and where the timekeeper sits</label><label><input type=checkbox data-k='In the room4'> Open the PDF on a second device in case the laptop fails</label><h2>During the talk</h2><label><input type=checkbox data-k='During the talk0'> Start with slide 1 and the opening question on slide 2</label><label><input type=checkbox data-k='During the talk1'> Glance at the clock at slide 10 (target 9:45 elapsed) and slide 16 (15:15)</label><label><input type=checkbox data-k='During the talk2'> If behind at slide 10, skip slides 12, 14 and 15</label><label><input type=checkbox data-k='During the talk3'> Point at the chart while explaining it</label><label><input type=checkbox data-k='During the talk4'> Pause after the audience vote (slide 14) before revealing</label><h2>Questions</h2><label><input type=checkbox data-k='Questions0'> Listen to the whole question; repeat it briefly for the audience</label><label><input type=checkbox data-k='Questions1'> Acknowledge → evidence → boundary</label><label><input type=checkbox data-k='Questions2'> Jump to backup slides by typing the number and pressing Enter</label><label><input type=checkbox data-k='Questions3'> If unsure, say what the thesis shows and what it would take to answer</label><label><input type=checkbox data-k='Questions4'> Thank the questioner</label><h2>Afterwards</h2><label><input type=checkbox data-k='Afterwards0'> Note the questions you were asked and how you answered</label><label><input type=checkbox data-k='Afterwards1'> Send the handout or slides if anyone asked</label>
<script>const st=JSON.parse(localStorage.getItem('ck')||'{}');const B=[...document.querySelectorAll('input')];
function upd(){const n=B.filter(b=>b.checked).length;document.getElementById('fill').style.width=(100*n/B.length)+'%';document.getElementById('pct').textContent=n+' of '+B.length+' done';}
B.forEach(b=>{b.checked=!!st[b.dataset.k];b.onchange=()=>{st[b.dataset.k]=b.checked;localStorage.setItem('ck',JSON.stringify(st));upd();}});upd();</script>
